server:
  port: 8080

maetd:
  jwt:
    jwks-validator:
      filter:
        enabled: ${VALIDATOR_TOKEN:false}  # Cambiar a true si quieres validar JWT
        excludes:
          - /actuator
          - /swagger-ui
          - /v3/api-docs
          - /health
        jwksUrl: ${JWKS_URL_TOKEN:http://maetd-dev.zenerconsulting.com:31036/realms/maetd/protocol/openid-connect/certs}

spring:
  datasource:
    datamart:
      hikari:
        maximum-pool-size: 5
        schema: ${MAETD_DATABASE_EXTERNAL_SCHEMA:public}
      driver-class-name: ${DATABASE_DRIVER_CLASS_NAME:org.postgresql.Driver}
      url: ${MAETD_DATABASE_URL_HRF:jdbc:postgresql://maetd-zener-dev-db-postgresql-do-user-18010495-0.j.db.ondigitalocean.com:25061/maetd_ms_general_db_pool?escapeSyntaxCallMode=callIfNoReturn}
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}

    jpa:
      hibernate:
        ddl-auto: ${DATABASE_OPERATION:validate}
      generate-ddl: true
      show-sql: true

  clients:
    rest:
      oauth2Engine:
        active: true
        oauth2Clients:
          - clientAlias: internal_ms_oauth
            tokenUrl: ${TOKEN_URL:http://maetd-dev.zenerconsulting.com:31036/realms/maetd/protocol/openid-connect/token}
            clientId: ${CLIENT_ID:ms-internal-rest-integrations}
            clientSecret: ${CLIENT_SECRET:p98Z7GuGxO3OTz99OBTwKAyaYKioGEgy}
            scopes:
              - openid
      systems:
        FILES_MS:
          oauth-client-alias: internal_ms_oauth
          endpoints:
            getFileList:
              url: ${CLIENT_REST_URL_FILE:http://maetd-ms-market-files:8080}/files
              method: get
              headers:
                "Content-Type": "application/json"
            uploadMultipleFiles:
              url: ${CLIENT_REST_URL_FILE:http://maetd-ms-market-files:8080}/files/multi-upload
              method: post
              headers:
                "Content-Type": "multipart/form-data"
            getFileData:
              url: ${CLIENT_REST_URL_FILE:http://maetd-ms-market-files:8080}/files/{id}/data
              method: get
              description: Servicio para obtener el binario de un fichero
              headers:
                "Content-Type": "application/octet-stream"
              path-parameters:
                - name: id
                  description: ID del fichero
                  required: true
                  schema:
                    type: string


