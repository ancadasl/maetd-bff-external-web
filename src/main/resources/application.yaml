server:
  port: 8080

spring:
  datasource:
    url: ${MAETD_DATABASE_URL_BFF_EXTERNAL_WEB:jdbc:postgresql://localhost:5432/maetd_ms_bff_external_web}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: ${DATABASE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 5
      schema: ${DATABASE_DEFAULT_SCHEMA:public}

  jpa:
    hibernate:
      ddl-auto: ${DATABASE_OPERATION:validate}
    generate-ddl: true
    show-sql: true

maetd:
  jwt:
    jwks-validator:
      filter:
        enabled: ${VALIDATOR_TOKEN:false}  # Cambiar a true si quieres validar JWT
        excludes:
          - /actuator
          - /swagger-ui
          - /v3/api-docs
          - /health
        jwksUrl: ${JWKS_URL_TOKEN:http://maetd-dev.zenerconsulting.com:31036/realms/creators-external/protocol/openid-connect/certs}
  clients:
    sftp:
      hostname: ${HOST_CLIENT_SFTP:maetd-dev.zenerconsulting.com}
      port:  ${PORT_CLIENT_SFTP:30222}
      username: ${USER_CLIENT_SFPT_ID:dev}
      password: ${USER_CLIENT_SFPT_PWD:ZGV2cGFzcw==}
      verifyHost: ${CLIENT_SFPT_VERIFY_HOST:false}
      defaultUploadPath: ${PATH_FILES_CLIENT_SFPT:/upload}
    rest:
      oauth2Engine:
        active: true
        oauth2Clients:
          - clientAlias: internal_ms_oauth
            tokenUrl: ${TOKEN_URL:http://maetd-dev.zenerconsulting.com:31036/realms/maetd/protocol/openid-connect/token}
            clientId: ${CLIENT_ID:ms-internal-rest-integrations}
            clientSecret: ${CLIENT_SECRET:p98Z7GuGxO3OTz99OBTwKAyaYKioGEgy}
            scopes:
              - openid
      systems:
        FILES_MS:
          oauth-client-alias: internal_ms_oauth
          endpoints:
            getFileList:
              url: ${CLIENT_REST_URL_FILE:http://maetd-ms-market-files.default.svc.cluster.local:8080}/files
              method: get
              headers:
                "Content-Type": "application/json"

            uploadMultipleFiles:
              url: ${CLIENT_REST_URL_FILE:http://maetd-ms-market-files.default.svc.cluster.local:8080}/files/multi-upload
              method: post
              headers:
                "Content-Type": "multipart/form-data"

            getFileData:
              url: ${CLIENT_REST_URL_FILE:http://maetd-ms-market-files.default.svc.cluster.local:8080}/files/{id}/data
              method: get
              description: Servicio para obtener el binario de un fichero
              headers:
                "Content-Type": "application/octet-stream"
              path-parameters:
                - name: id
                  description: ID del fichero
                  required: true
                  schema:
                    type: string
        CREATORS_MS:
              oauth-client-alias: internal_ms_oauth
              endpoints:
                getCreators:
                  url: ${CLIENT_REST_URL_CREATOR:http://maetd-ms-market-creators.default.svc.cluster.local:8080}/market-creators
                  method: get
                  headers:
                    "Content-Type": "application/json"
        EVALUATION_MS:
              oauth-client-alias: internal_ms_oauth
              endpoints:
                getReports:
                  url: ${CLIENT_REST_URL_EVALUATION:http://maetd-ms-market-evaluations.default.svc.cluster.local:8080}/reports
                  method: get
                  headers:
                    "Content-Type": "application/json"


