openapi: 3.0.2
servers:
  - description: Servidor de Desarrollo
    url: http://maetd-dev.zenerconsulting.com:31447
info:
  x-api-id: 2f47b1b0-5d3c-4c2f-97c9-8e20b3a13e72
  x-audience: company-internal
  description: "API para gestionar las funcionalidades de bff external web"
  version: 1.0.0
  title: MAETD BFF external web
  contact:
    name: Zener Soft Consulting
    email: oliver.munoz@zenerconsulting.com
paths:
  /documents:
    get:
      operationId: getDocuments
      description: Servicio para obtener el listado de documentos de canal web externa
      parameters:
        - name: page
          in: query
          description: Número de pagina
          schema:
            type: integer
        - name: size
          in: query
          description: Número de filas por pagina
          schema:
            type: integer
        - name: creationDate
          in: query
          description: Fecha de creación
          schema:
            type: string
            format: 'date'
        - name: category
          in: query
          description: Filtro por categoria de documento (web externa creadores)
          schema:
            type: string
            enum:
              - NORMATIVES
              - ACTAS_LETTER
              - ACTAS_BOND
              - COMPLIANCE_LETTER
              - COMPLIANCE_BOND
              - BASKET_LETTER
              - BASKET_BOND
              - EVALUATION
        - name: csb
          in: query
          description: Para filtrar evaluaciones por creador enweb externa
          schema:
            type: string
            nullable: true
        - name: language
          in: query
          description: Documentos por lenguaje
          schema:
            type: string
            nullable: true
            enum:
              - ES
              - EN
      responses:
        200:
          description: Listado de documentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDataList'
  /documents/{id}/data:
    get:
      operationId: getDocumentData
      description: Servicio para obtener el binario de un documento de web externa
      parameters:
        - $ref: '#/components/parameters/documentIdParam'
      responses:
        200:
          description: Binario del fichero
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/FileBinaryData'
  /evaluations:
    get:
      operationId: getEvaluations
      description: Servicio para obtener un listado de Evaluaciones por producto
      parameters:
        - name: productType
          in: query
          description: Filtro por tipo de producto
          schema:
            type: string
            enum:
              - LETTER
              - BOND
        - name: csb
          in: query
          description: Para filtrar evaluaciones por creador en web externa
          schema:
            type: string
            nullable: true
        - name: month
          in: query
          description: Mes de la evaluación
          schema:
            type: integer
            format: int32
            nullable: true
        - name: year
          in: query
          description: Año de la evaluación
          schema:
            type: integer
            format: int32
            nullable: true
        - name: status
          in: query
          description: Estados de la evaluación
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - FINISH_PRE_FINISHED
                - FINISH_DRAFT_FINISHED
                - FINISH_CLOSED_FINISHED
                - FINISH_CONSOLIDATED_FINISHED
      responses:
        200:
          description: Listado de evaluaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationDataList'
  /auctions:
    get:
      operationId: getAuctions
      description: Servicio para obtener un listado de subasta por producto
      parameters:
        - name: productType
          in: query
          description: Filtro tipo de producto
          schema:
            type: string
            nullable: false
            enum:
              - LETTER
              - BOND
        - name: csb
          in: query
          description: Para filtrar subastas por creador en web externa
          schema:
            type: string
            nullable: false
        - name: month
          in: query
          description: Mes de la subasta
          schema:
            type: integer
            format: int32
            nullable: true
        - name: year
          in: query
          description: Año de la subasta
          schema:
            type: integer
            format: int32
            nullable: true
      responses:
        200:
          description: Listado de subastas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionsDataGroup'
  /evaluations/joint:
    get:
      operationId: getEvaluationsJoint
      description: Servicio para obtener un listado de Evaluaciones conjunta Letras y Bonos
      parameters:
        - name: csb
          in: query
          description: Para filtrar evaluaciones conjunta Letras y Bonos por creador en web externa
          schema:
            type: string
            nullable: true
        - name: month
          in: query
          description: Mes de la evaluación
          schema:
            type: integer
            format: int32
            nullable: true
        - name: year
          in: query
          description: Año de la evaluación
          schema:
            type: integer
            format: int32
            nullable: true
        - name: status
          in: query
          description: Estados de la evaluación
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - FINISH_PRE_FINISHED
                - FINISH_DRAFT_FINISHED
                - FINISH_CLOSED_FINISHED
                - FINISH_CONSOLIDATED_FINISHED
      responses:
        200:
          description: Listado de evaluaciones conjunta Letras y Bonos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationJoinDataList'
  /syndicated-issues:
    get:
      operationId: getSyndicatedIssues
      description: Servicio para obtener un listado de syndicated issues
      parameters:
        - name: csb
          in: query
          description: Para filtrar syndicated issues por creador en web externa
          schema:
            type: string
            nullable: true
        - name: month
          in: query
          description: Busqueda por Mes
          schema:
            type: integer
            format: int32
            nullable: true
        - name: year
          in: query
          description: Busqueda por Año
          schema:
            type: integer
            format: int32
            nullable: true
      responses:
        200:
          description: Listado de syndicate issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyndicatedIssuesDataList'
  /charts:
    get:
      operationId: getCharts
      description: Servicio para obtener la información para gráficas
      parameters:
        - name: productType
          in: query
          description: Filtro tipo de producto
          schema:
            type: string
            nullable: false
            enum:
              - LETTER
              - BOND
        - name: csb
          in: query
          description: Para filtrar por creador en web externa
          schema:
            type: string
            nullable: false
        - name: year
          in: query
          description: Año
          schema:
            type: integer
            format: int32
            nullable: true
      responses:
        200:
          description: Listado de subastas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartsDataGroup'
  /market-creators:
    get:
      operationId: getMarketCreators
      description: Servicio para obtener un listado de creadores de mercado
      responses:
        200:
          description: Listado de creadores de mercado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketCreatorData'
  /reports/creator/{id}:
    get:
      operationId: getReports
      description: Obtiene los informes de Mercado Ciego por creador
      parameters:
        - name: page
          in: query
          description: Número de pagina
          required: true
          schema:
            type: integer
        - name: size
          in: query
          description: Número de filas por pagina
          required: true
          schema:
            type: integer
        - name: id
          in: path
          description: Id del creador
          schema:
            type: integer
          required: true
        - name: year
          in: query
          description: Año
          schema:
            type: integer
        - name: month
          in: query
          description: Mes
          schema:
            type: integer
      responses:
        200:
          description: Listado de informes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsDataList'
  /reports/data:
    get:
      operationId: getReportData
      description: Servicio para obtener el binario de un informe de web externa
      parameters:
        - name: filename
          in: query
          description: Nombre del fichero
          required: true
          schema:
            type: string
      responses:
        200:
          description: Binario del fichero
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/FileBinaryData'

components:
  schemas:
    DocumentDataList:
      type: object
      description: Listado de documentos
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentData'
        total:
          description: Número total de documentos
          type: integer
    DocumentData:
      type: object
      description: Datos de los documentos
      properties:
        id:
          type: string
          description: Identificador UUID del fichero
          format: 'uuid'
        documentName:
          type: string
          description: Nombre del documento
        description:
          type: string
          description: Breve descripción sobre el contenido del documento
        path:
          type: string
          description: Ruta del documento
          format: 'uri'
        fileType:
          type: string
          description: Tipo de fichero
        categoryType:
          type: string
          description: Categoria a la que pertenece el documento
          enum:
            - NORMATIVES
            - ACTAS_LETTER
            - ACTAS_BOND
            - COMPLIANCE_LETTER
            - COMPLIANCE_BOND
            - BASKET_LETTER
            - BASKET_BOND
            - EVALUATION
            - EMERGENCY_PROCESS
        creationDate:
          description: Fecha de creación
          type: string
          format: 'date'
        hashcode:
          type: string
        originSystem:
          type: string
          description: Identificador del sistema origen
          nullable: true
        csb:
          type: string
          description: Código csb del creador, para web externa creadores indentifcamos al creador que sube el documento
    EvaluationDataList:
      type: object
      description: Listado de evaluaciones
      properties:
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationData'
    EvaluationJoinDataList:
      type: object
      description: Listado de evaluaciones conjunta Letras y Bonos
      properties:
        evaluationsJoint:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationJointData'
    AuctionsDataGroup:
      type: object
      description: Primario y secundario subasta
      properties:
        primaryAuctions:
          $ref: '#/components/schemas/AuctionData'
        secondaryAuctions:
          $ref: '#/components/schemas/AuctionData'
    ChartsDataGroup:
      type: object
      description: Primario secundario y total para gráficas
      properties:
        primaryCharts:
          type: array
          items:
            $ref: '#/components/schemas/ChartData'
        secondaryCharts:
          type: array
          items:
            $ref: '#/components/schemas/ChartData'
        totalCharts:
          type: array
          items:
            $ref: '#/components/schemas/ChartData'
        overBiddingCharts:
          type: array
          items:
            $ref: '#/components/schemas/ChartData'
    ReportsDataList:
      type: object
      description: Listado de informes
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReportData'
        total:
          description: Número total de informes
          type: integer
    EvaluationData:
      type: object
      properties:
        evaluationId:
          type: integer
          format: int64
        status:
          type: string
        csb:
          type: string
        year:
          type: integer
        month:
          type: string
        monthNumeric:
          type: integer
        jointMonthly:
          type: number
          format: double
        cumulative:
          type: number
          format: double
        letter:
          type: string
        bond:
          type: number
          format: double
        subscription:
          type: number
          format: double
        quoting:
          type: number
          format: double
        trading:
          type: number
          format: double
        electronic:
          type: number
          format: double
        tier:
          type: string
        clients:
          type: number
          format: double
        strips:
          type: number
          format: double
        qualitative:
          type: number
          format: double
        secondRound:
          type: number
          format: double
        productType:
          type: string
          description: Tipo de Producto
          enum:
            - LETTER
            - BOND
    EvaluationJointData:
      type: object
      properties:
        status:
          type: string
        csb:
          type: string
        year:
          type: integer
        monthNumeric:
          type: integer
        jointMonthly:
          type: number
          format: double
        cumulative:
          type: number
          format: double
        letter:
          type: string
        bond:
          type: number
          format: double
    AuctionData:
        type: object
        properties:
          csb:
            type: string
          year:
            type: integer
          monthNumeric:
            type: integer
          productType:
            type: string
            description: Tipo de Producto
            enum:
              - LETTER
              - BOND
          computable_sale:
            type: integer
          total_sale:
            type: integer
          penalty:
            type: boolean
          basket:
            type: number
            format: double
            nullable: true
    ChartData:
      type: object
      properties:
        csb:
          type: string
        month:
          type: integer
        productType:
          type: string
          description: Tipo de Producto
          enum:
            - LETTER
            - BOND
        total_points:
          type: number
          format: double
        media:
          type: number
          format: double
    SyndicatedIssuesDataList:
      type: object
      description: Listado de syndicated issues
      properties:
        syndicatedIssues:
          type: array
          items:
            $ref: '#/components/schemas/SyndicatedIssuesData'
    SyndicatedIssuesData:
      type: object
      properties:
        csb:
          type: string
        year:
          type: integer
        month:
          type: integer
        size:
          type: number
        expiration:
          type: number
        currency:
          type: string
        syndicated:
          type: boolean
    FileBinaryData:
      type: string
      format: binary
      description: Binario pdf
    MarketCreatorData:
      type: object
      description: Datos de los creadores de mercado
      properties:
        id:
          type: string
          description: Id del creador
          example: 1
        name:
          type: string
          description: Nombre del creador de mercado
          example: 1
        csb:
          type: string
          description: Código CSB del creador
          example: 3880
    ReportData:
      type: object
      description: Datos de Informe
      properties:
        fileName:
          type: string
          description: Nombre del fichero
          example: 1
        filePath:
          type: string
          description: Ruta del fichero
        fileDate:
          type: string
          description: fecha del fichero
  parameters:
    documentIdParam:
      name: id
      in: path
      description: Parametro identificador de documento
      required: true
      allowEmptyValue: false
      schema:
        type: string
        format: 'uuid'